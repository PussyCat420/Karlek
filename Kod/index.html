<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kärleksquiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
html,body{height:100%;overflow:hidden;background:#ffeef4;}

.slide{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
opacity:0;
transition:1s;
pointer-events:none;
z-index:1;
}

.slide.active{opacity:1;pointer-events:auto;}

h1,h2{color:#ff4d88;margin-bottom:20px;}

img{
width:250px;
height:250px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;
}

.answers{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
max-width:600px;
}

button{
padding:18px;
font-size:18px;
border:none;
border-radius:20px;
background:#ff99bb;
color:white;
cursor:pointer;
transition:0.2s;
}
button:hover{transform:scale(1.1);background:#ff4d88;}

.fullOverlay{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
color:#ff4d88;
text-align:center;
padding:40px;
opacity:0;
transition:1s;
z-index:5;
pointer-events:none;
}
.fullOverlay.show{opacity:1;pointer-events:auto;}

.tulip{
position:absolute;
font-size:30px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-50px);}
100%{transform:translateY(110vh);}
}

.result{
max-width:800px;
overflow:auto;
height:70%;
}

.correct{color:green;}
.wrong{color:red;}
</style>
</head>
<body>

<!-- Bakgrunds-tulpan-container -->
<div id="backgroundTulips" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></div>

<!-- Bakgrundsmusik -->
<audio id="bgMusic" src="Karlek.mp3" loop></audio>

<!-- START -->
<div class="slide active" id="start">
<h1>Är du redo...</h1>
<button onclick="startFlow()">Start</button>
</div>

<!-- INTRO OVERLAY -->
<div class="fullOverlay" id="overlay">
Svara på alla frågor så får du din belöning den 14nde
</div>

<!-- QUIZ SLIDE -->
<div class="slide" id="quiz"></div>

<!-- FINAL RESULT SLIDE -->
<div class="slide" id="final">
<h1>Quiz klart 💕</h1>
<div class="result" id="analysis"></div>
</div>

<script>
// Quizdata
const questions=[
{
img:"q1.jpg",
q:"Vilka av dessa var en av Melkers många bra charmiga repliker som fick Arwa att falla för han som mest😍",
a:["Vilka STORA ögon du har","Vill du räkna axlar?","tjena kexet sitter du här och smular","Är de här en dröm, Du måste vara den vackraste tjejen jag någonsin har sett"],
correct:0
},
{
img:"q2.jpg",
q:"Vilket alternativ är en utav de gemensamma intressen som var en anledning till att glöden kunde tändas igen mellan kärleksparet Melker och Arwa",
a:["Ett intresse för resor","Ett intresse för birkin bags","Ett intresse för friluftsliv","Ett intresse för One direction"],
correct:0
},
{
img:"q3.jpg",
q:"Vilka av dessa var en av Arwas många bra charmiga repliker som fick Melker att falla för henne som mest😍",
a:["Fan va du är lång, jag antar att den längden fortsatt på andra ställen också;)?","Jag börjar ändå fatta vad Elin menade","Vill du vara ihop? Ja, Nej, Kanske","Nej min katt fastna i ett träd om det bara fanns någon snygg och hjälpsam grabb som kunde ta ner henne"],
correct:1
},
{
img:"q4.jpg",
q:"Vad hette restaurangen där repliken 'Man vrider breeh' kommer ifrån",
a:["Ingeborgs i Örebro","Ll'Amice Örebro","Hemma Hos Örebro","Fratelli Örebro"],
correct:3
},
{
img:"q5.jpg",
q:"Vilka av dessa smeknamn har aldrig nämnts förut",
a:["Minis","Arga","piggiliten","Gladis"],
correct:3
}
];

let current=0;
let answers=[];

// Start flow
function startFlow(){
    const overlay = document.getElementById("overlay");
    const startSlide = document.getElementById("start");

    // Starta bakgrundsmusiken vid klick
    const bgMusic = document.getElementById("bgMusic");
    bgMusic.play().catch(e => console.log("Autoplay blockerad, musiken startar vid klick!"));

    // Visa overlay för start
    overlay.innerText = "Svara på alla frågor så får du din belöning den 14nde";
    overlay.classList.add("show");

    setTimeout(()=>{
        startSlide.classList.remove("active");
        setTimeout(()=>{
            overlay.classList.remove("show");
            showQuestion(); // Starta quizet
        }, 3000);
    }, 100);
}

// Tulpanregn i bakgrunden kontinuerligt
function continuousTulips(){
const container=document.getElementById("backgroundTulips");
setInterval(()=>{
let t=document.createElement("div");
t.className="tulip";
t.innerText="🌷";
t.style.left=Math.random()*100+"%";
t.style.fontSize=(20+Math.random()*20)+"px";
t.style.animationDuration=(5+Math.random()*3)+"s";
container.appendChild(t);
setTimeout(()=>t.remove(),8000);
},400);
}
continuousTulips();

// Tulpan-animation vid frågaövergång
function tulips(){
for(let i=0;i<15;i++){
let t=document.createElement("div");
t.className="tulip";
t.innerText="🌷";
t.style.left=Math.random()*100+"%";
t.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(t);
setTimeout(()=>t.remove(),3000);
}
}

// Visa fråga
function showQuestion(){
    tulips();
    const quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    if(current < questions.length){
        // Visa quizfrågor 1-5
        const q = questions[current];
        quiz.innerHTML = `<img src="${q.img}"><h2>${q.q}</h2><div class="answers"></div>`;
        q.a.forEach((text,i)=>{
            const b = document.createElement("button");
            b.innerText = text;
            b.onclick = ()=>answer(i);
            quiz.querySelector(".answers").appendChild(b);
        });
        quiz.classList.add("active");

    } else if(current === questions.length){
        // Mellansteg innan sista frågan
        const overlay = document.getElementById("overlay");
        overlay.innerText = "Och nu den sista och viktigaste frågan av de alla...";
        overlay.classList.add("show");
        setTimeout(()=>{
            overlay.classList.remove("show");
            current++; // gå till sista fråga
            showQuestion(); // visa sista frågan
        }, 3000);

    } else if(current === questions.length + 1){
        // Sista Ja/Nej-frågan
        showYesNo("Vill du vara min valentime?");
    } else {
        // Visa resultat
        showResults();
    }
}

// Svar på fråga
function answer(i){
    answers.push(i);
    current++;
    showQuestion();
}

// Ja/Nej-fråga
function showYesNo(text){
tulips();
const quiz=document.getElementById("quiz");
quiz.innerHTML=`
<h2>${text}</h2>
<div class="answers">
<button onclick="nextAfterYes()">Ja</button>
<button id="noBtn">Nej</button>
</div>`;
const no=document.getElementById("noBtn");
no.onmouseover=()=>{
no.style.position="absolute";
no.style.left=Math.random()*80+"%";
no.style.top=Math.random()*80+"%";
};
}

// När man klickar "Ja" går man bara vidare
function nextAfterYes(){
current++;
showQuestion();
}

// Visa slutresultat
function showResults(){
document.getElementById("quiz").classList.remove("active");
const final=document.getElementById("final");
final.classList.add("active");

let score=0;
let html="<h2>Resultat:</h2>";

questions.forEach((q,i)=>{
let correct=q.correct===answers[i];
if(correct)score++;
html+=`<p class="${correct?"correct":"wrong"}">
Fråga ${i+1}: ${correct?"Rätt":"Fel"}<br>
Rätt svar: ${q.a[q.correct]}
</p><br>`;
});

html=`<h2>Score: ${score}/${questions.length}</h2>`+html;
document.getElementById("analysis").innerHTML=html;
}
</script>

</body>
</html>
