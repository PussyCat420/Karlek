<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kärleksquiz</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
html,body{height:100%;overflow:hidden;background:#ffeef4;}

.slide{
position:absolute;width:100%;height:100%;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
text-align:center;padding:30px;
opacity:0;transition:1s;
pointer-events:none;z-index:1;
}
.slide.active{opacity:1;pointer-events:auto;}

h1,h2{color:#ff4d88;margin-bottom:20px;}

img{
width:250px;height:250px;
object-fit:cover;border-radius:20px;
margin-bottom:20px;
}

.answers{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;max-width:600px;
}

button{
padding:18px;font-size:18px;
border:none;border-radius:20px;
background:#ff99bb;color:white;
cursor:pointer;transition:0.2s;
}
button:hover{transform:scale(1.1);background:#ff4d88;}

.fullOverlay{
position:absolute;width:100%;height:100%;
background:white;display:flex;
align-items:center;justify-content:center;
font-size:34px;color:#ff4d88;
text-align:center;padding:40px;
opacity:0;transition:1s;
z-index:5;pointer-events:none;
}
.fullOverlay.show{opacity:1;pointer-events:auto;}

.tulip{
position:absolute;font-size:30px;
animation:fall linear infinite;
}
@keyframes fall{
0%{transform:translateY(-50px);}
100%{transform:translateY(110vh);}
}

.result{max-width:800px;overflow:auto;height:70%;}
.correct{color:green;}
.wrong{color:red;}

#secretTrigger{
margin-top:20px;
font-size:12px;
opacity:0.25;
cursor:pointer;
}

/* SECRET */

#secretScreen{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:#0d0d0d;
color:white;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
}

#secretScreen input{
padding:12px;
font-size:22px;
margin-top:10px;
text-align:center;
}

/* LOVE LETTER */

#loveLetter{
display:none;
position:fixed;
top:0;left:0;width:100%;height:100%;
background:radial-gradient(circle,#2b0f0f,#000);
align-items:center;
justify-content:center;
z-index:1000;
}

.letter{
width:75%;
max-width:750px;
height:70vh;
overflow-y:auto;
padding:50px;
background:#f5e1c8;
border-radius:10px;
font-family:"Dancing Script",cursive;
font-size:30px;
line-height:1.6;
color:#3b2a20;
border:6px solid #2a1b12;
box-shadow:
0 0 60px rgba(255,120,60,0.7),
inset 0 0 100px rgba(0,0,0,0.8);
animation:glow 2.5s infinite alternate, rollUp 1.6s ease-out;
}

@keyframes glow{
0%{box-shadow:0 0 40px rgba(255,120,60,0.6), inset 0 0 100px rgba(0,0,0,0.8);}
50%{box-shadow:0 0 80px rgba(255,80,20,0.9), inset 0 0 120px rgba(0,0,0,0.9);}
100%{box-shadow:0 0 40px rgba(255,120,60,0.6), inset 0 0 100px rgba(0,0,0,0.8);}
}

@keyframes rollUp{
0%{transform:translateY(120%) scale(0.8);opacity:0;}
100%{transform:translateY(0) scale(1);opacity:1;}
}

.letter::-webkit-scrollbar{width:10px;}
.letter::-webkit-scrollbar-thumb{
background:#c79b6c;
border-radius:10px;
}
</style>
</head>
<body>

<div id="backgroundTulips" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></div>

<audio id="bgMusic" src="Karlek.mp3" loop></audio>

<div class="slide active" id="start">
<h1>Är du redo...</h1>
<button onclick="startFlow()">Start</button>
</div>

<div class="fullOverlay" id="overlay">
Svara på alla frågor så får du din belöning den 14nde
</div>

<div class="slide" id="quiz"></div>

<div class="slide" id="final">
<h1>Quiz klart 💕</h1>
<div class="result" id="analysis"></div>
</div>

<div id="secretScreen">
<h2>Skriv lösenordet</h2>
<p>Hint: Vilket är det första landet vi kommer åka till tillsammans efter gymnasiet ;) ?</p>
<p>(5 bokstäver)</p>
<input id="passwordInput" placeholder="*****">
<button onclick="checkPassword()">OK</button>
</div>

<div id="loveLetter">
<div class="letter" id="letterText"></div>
</div>

<script>

const loveMessage = `Hej älskling, du lyckades klura ut det.
.......................................
.......................................
....
Just nu när jag skriver detta så tänker jag på dig. På det fina leendet och glittret i ögonen som jag ser när du kollar på mig. Du var alltid en självklarhet för mig. "Det är klart att jag vill ha Arwa". WOW, alltså du får mig att känna att alla picky år utan dig var värda det. Det har alltid varit något fel med alla andra. Något som saknades. Min saknad har varit dig. Jag kommer aldrig sluta sakna dig, Arwa. Det spelar ingen roll hur vår framtid ser ut. ❤️

Du är verkligen en på miljonen. Det känns som att du kan få blommor att blomma med bara den energi du strålar ut. ❤️

Jag älskar dig och jag älskar all tid jag har fått chansen att spendera med dig. Tid med dig är aldrig slöseri. Spelar ingen roll hur gnällig jag är på dig om att vi ska göra något, jag tycker fortfarande att den tiden jag gnäller på dig är värdefull, för det finns inget värdefullt utan dig i det. ❤️

Du ger jorden värde och jag vet att du har en gåva. Jag vill att du ska ta vara på den gåva du har, Arwa, och göra världen och mig stolt. Jag har alltid trott detta, Arwa. Innan vi blev tillsammans också. Att du är en av de personerna med mening. Det är förmodligen en stor anledning till varför jag blev så snabbt galen i dig i ettan. Jag har varit en person som länge har försökt söka mening i saker, det är inte förrän jag träffade dig som jag faktiskt kände det. Det är det som är din magiska energi. ❤️

Min tid kändes värdefull med dig. Det kändes meningsfullt. Nu vet jag varför. Meningen börjar och slutar med oss. Mitt värde är med dig. Jag älskar dig, Arwa. Glöm aldrig din gåva. ❤️`;

function typeWriter(text, el, speed=35){
let i=0;
function typing(){
if(i<text.length){
el.innerHTML += text.charAt(i);
i++;
setTimeout(typing,speed);
}}
typing();
}

const questions=[
{img:"q1.jpg",q:"Vilka av dessa var en av Melkers många bra charmiga repliker som fick Arwa att falla för han som mest😍",a:["Vilka STORA ögon du har","Vill du räkna axlar?","tjena kexet sitter du här och smular","Är de här en dröm, Du måste vara den vackraste tjejen jag någonsin har sett"],correct:0},
{img:"q2.jpg",q:"Vilket alternativ är en utav de gemensamma intressen som var en anledning till att glöden kunde tändas igen mellan kärleksparet Melker och Arwa",a:["Ett intresse för resor","Ett intresse för birkin bags","Ett intresse för friluftsliv","Ett intresse för One direction"],correct:0},
{img:"q3.jpg",q:"Vilka av dessa var en av Arwas många bra charmiga repliker som fick Melker att falla för henne som mest😍",a:["Fan va du är lång, jag antar att den längden fortsatt på andra ställen också;)?","Jag börjar ändå fatta vad Elin menade","Vill du vara ihop? Ja, Nej, Kanske","Nej min katt fastna i ett träd om det bara fanns någon snygg och hjälpsam grabb som kunde ta ner henne"],correct:1},
{img:"q4.jpg",q:"Vad hette restaurangen där repliken 'Man vrider breeh' kommer ifrån",a:["Ingeborgs i Örebro","Ll'Amice Örebro","Hemma Hos Örebro","Fratelli Örebro"],correct:3},
{img:"q5.jpg",q:"Vilka av dessa smeknamn har aldrig nämnts förut",a:["Minis","Arga","piggiliten","Gladis"],correct:3}
];

let current=0;
let answers=[];

function startFlow(){
document.getElementById("bgMusic").play();
const overlay=document.getElementById("overlay");
overlay.classList.add("show");
setTimeout(()=>{
document.getElementById("start").classList.remove("active");
overlay.classList.remove("show");
showQuestion();
},3000);
}

function continuousTulips(){
const c=document.getElementById("backgroundTulips");
setInterval(()=>{
let t=document.createElement("div");
t.className="tulip";
t.innerText="🌷";
t.style.left=Math.random()*100+"%";
t.style.animationDuration=(5+Math.random()*3)+"s";
c.appendChild(t);
setTimeout(()=>t.remove(),8000);
},400);
}
continuousTulips();

function showQuestion(){
const quiz=document.getElementById("quiz");
quiz.innerHTML="";

if(current<questions.length){
let q=questions[current];
quiz.innerHTML=`<img src="${q.img}"><h2>${q.q}</h2><div class="answers"></div>`;
q.a.forEach((t,i)=>{
let b=document.createElement("button");
b.innerText=t;
b.onclick=()=>{answers.push(i);current++;showQuestion();};
quiz.querySelector(".answers").appendChild(b);
});
quiz.classList.add("active");

}else if(current===questions.length){

const overlay=document.getElementById("overlay");
overlay.innerText="Och nu den sista och viktigaste frågan av de alla...";
overlay.classList.add("show");

setTimeout(()=>{
overlay.classList.remove("show");
current++;
showQuestion();
},3000);

}else if(current===questions.length+1){

quiz.innerHTML=`
<h2>Vill du vara min valentime? 💘</h2>
<div class="answers">
<button onclick="current++;showQuestion()">Ja</button>
<button id="noBtn">Nej</button>
</div>`;

const no=document.getElementById("noBtn");
no.onmouseover=()=>{
no.style.position="absolute";
no.style.left=Math.random()*80+"%";
no.style.top=Math.random()*80+"%";
};

quiz.classList.add("active");

}else{
showResults();
}
}

function showResults(){
document.getElementById("quiz").classList.remove("active");
document.getElementById("final").classList.add("active");

let score=0;
let html="<h2>Resultat:</h2>";

questions.forEach((q,i)=>{
let correct=q.correct===answers[i];
if(correct)score++;
html+=`<p class="${correct?"correct":"wrong"}">
Fråga ${i+1}: ${correct?"Rätt":"Fel"}<br>
Rätt svar: ${q.a[q.correct]}
</p><br>`;
});

html=`<h2>Score: ${score}/${questions.length}</h2>`+html+
`<div id="secretTrigger" onclick="openSecret()">…</div>`;

document.getElementById("analysis").innerHTML=html;
}

function openSecret(){
document.getElementById("secretScreen").style.display="flex";
}

function checkPassword(){
let val=document.getElementById("passwordInput").value.toLowerCase();
if(val==="indien"){
document.getElementById("secretScreen").style.display="none";
document.getElementById("loveLetter").style.display="flex";
let el=document.getElementById("letterText");
el.innerHTML="";
el.scrollTop=0;
typeWriter(loveMessage,el);
}else alert("du får tänka hårdare älskling");
}

</script>
</body>
</html>
